spring:
  application:
    name: resumeai-backend
  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resumeai}
    username: ${DB_USER:resumeai}
    password: ${DB_PASSWORD:resumeai123}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  jackson:
    serialization:
      fail-on-empty-beans: false

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: 0.7
            max-output-tokens: 8192

server:
  port: ${PORT:${SERVER_PORT:8081}}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsLongEnoughToBeSecure2024ResumeAI}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  ai:
    rate-limit:
      requests-per-hour: ${AI_RATE_LIMIT:20}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.resumeai: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
