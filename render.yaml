services:
  # ─── ELEVATECV Spring Boot Backend ──────────────────────────────────────────
  - type: web
    name: elevatecv-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api-docs
    envVars:
      - key: PORT
        value: 8081
      - key: DB_HOST
        fromDatabase:
          name: elevatecv-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: elevatecv-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: elevatecv-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: elevatecv-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: elevatecv-postgres
          property: password
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"

databases:
  # ─── Managed PostgreSQL Database ─────────────────────────────────────────────
  - name: elevatecv-postgres
    databaseName: elevatecv
    user: elevatecv
    plan: free
    region: oregon
